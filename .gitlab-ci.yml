stages:
  - fastapibuild
  - reactbuild
  - cron

fastapi-build:            
  stage: fastapibuild
  tags:
    - main_backend
  script:
    - cd Backend/FastAPI
    - echo "CRON_SECRET=${CRON_SECRET}" >> .env
    - sudo systemctl stop stock-ai-backend.service || true
    - sudo systemctl disable stock-ai-backend.service || true
    - sudo rm /etc/systemd/system/stock-ai-backend.service || true
    - sudo systemctl daemon-reload
    - sudo podman rm -f stock-ai-backend || true
    - sudo podman rmi myfastapi || true
    - sudo podman system prune -f
    - sudo podman build -t myfastapi .
    - sudo podman run -d --name stock-ai-backend --env-file .env -p 8080:8080 myfastapi
    - sudo podman generate systemd --name stock-ai-backend | sudo tee /etc/systemd/system/stock-ai-backend.service
    - sudo systemctl daemon-reload
    - sudo systemctl enable stock-ai-backend.service
    - sudo systemctl start stock-ai-backend.service
  only:
    refs:
      - main
    changes: 
      - Backend/**/*

react-build:
  stage: reactbuild
  tags:
    - main_backend
  script:
    - cd Frontend
    - npm install
    - npm run build
    - sudo rm -rf /var/www/html/*
    - sudo cp -r dist/* /var/www/html/
  only:
    refs:
      - main
    changes:
      - Frontend/**/*

daily-snapshots:
  stage: cron
  tags:
    - main_backend
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
  script:
    - |
      curl -f -X POST "${API_BASE_URL}/internal/snapshots/daily" \
        -H "x-cron-secret: ${CRON_SECRET}"
